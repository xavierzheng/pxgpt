name: release

# Tags and releases are never written by hand. setup.py's `version=` is the
# single source; after CI passes on main, this workflow creates the tag
# `v<version>` and a GitHub Release for it. If that tag already exists (the
# commit did not bump the version), it does nothing.
#
# It runs after CI rather than on push so a commit whose tests fail is never
# released. A tag created with github.token does not trigger other workflows.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      # The commit CI tested, not whatever main points at now.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Read the version from setup.py
        id: v
        run: |
          pip install --quiet setuptools
          # setup.py may print warnings first; the version is the last line.
          VERSION="$(python setup.py --version 2>/dev/null | tail -n 1)"
          if [ -z "$VERSION" ]; then
            echo "could not read a version from setup.py" >&2
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create the tag and release if they do not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists, skip"
            exit 0
          fi
          gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes
